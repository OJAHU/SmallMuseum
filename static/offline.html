<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>オフライン - 小さな展覧会</title>

    <meta name="theme-color" content="#2d201b">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;

            display: grid;
            place-items: center;

            padding: 24px;

            color: #2b2118;
            background: #f8efd9;

            font-family:
                "Yu Mincho",
                "Yu Gothic",
                serif;
        }

        main {
            width: min(500px, 100%);

            padding: 40px;

            text-align: center;

            background: #fffaf0;

            border: 8px solid #b9974f;
        }

        h1 {
            margin-top: 0;
        }

        button {
            margin-top: 20px;
            padding: 12px 24px;

            border: 0;
            border-radius: 999px;

            background: #3c2a24;
            color: white;

            cursor: pointer;
        }
    </style>
</head>

<body>

<main>

    <h1>小さな展覧会</h1>

    <h2>オフラインです</h2>

    <p>
        インターネットに接続してから、
        もう一度お試しください。
    </p>

    <button onclick="location.reload()">
        再読み込み
    </button>

</main>

</body>

</html>
